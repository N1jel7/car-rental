services:
  postgres:
    image: postgres:16
    container_name: carrental-postgres
    environment:
      POSTGRES_DB: carrental
      POSTGRES_USER: carrental_app
      POSTGRES_PASSWORD: carrental_pass
    ports:
      - "5432:5432"
    volumes:
      - ./src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./src/main/resources/db/test-data.sql:/docker-entrypoint-initdb.d/02-test-data.sql
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: